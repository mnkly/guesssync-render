name: Render Batch
# يرندر قائمة كومبوزشنز بالتوازي (matrix). كل وظيفة = كومبوزشن واحد.
# الإدخال: compositions = مصفوفة JSON، مثال: ["E16Quiz","Short-E16-1","ThumbLandmark"]
# الحد المجاني: ~20 وظيفة بالتوازي. النواتج تُرفع كـartifacts (تُجلب محلياً بـgh run download).
on:
  workflow_dispatch:
    inputs:
      compositions:
        description: 'JSON array of composition ids'
        required: true
        default: '["E16Quiz"]'

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        comp: ${{ fromJson(github.event.inputs.compositions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/rtmp && sudo chmod 777 /mnt/rtmp
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chromium libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libpango-1.0-0 libcairo2 libxshmfence1 ffmpeg
      - name: Install deps
        run: npm ci || npm install
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Render ${{ matrix.comp }}
        id: r
        env:
          TMPDIR: /mnt/rtmp
          TEMP: /mnt/rtmp
          TMP: /mnt/rtmp
        run: |
          set -e
          COMP="${{ matrix.comp }}"
          # optional "Name@START-END" for chunked frame-range renders
          NAME="${COMP%@*}"
          RANGE=""
          [[ "$COMP" == *@* ]] && RANGE="${COMP#*@}"
          SAFE="${COMP//@/__}"; SAFE="${SAFE//:/_}"
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          mkdir -p out
          if [[ "$NAME" == Thumb* ]]; then
            echo "=== still: $NAME ==="
            npx remotion still "$NAME" "out/$SAFE.png"
          else
            FR=""
            [[ -n "$RANGE" ]] && FR="--frames=$RANGE"
            echo "=== video: $NAME (frames=${RANGE:-all}) ==="
            time npx remotion render "$NAME" "out/$SAFE.mp4" $FR --concurrency=2
          fi
          ls -la out/
      - name: Upload ${{ matrix.comp }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.r.outputs.safe }}
          path: |
            out/${{ steps.r.outputs.safe }}.mp4
            out/${{ steps.r.outputs.safe }}.png
          if-no-files-found: error
          retention-days: 5
